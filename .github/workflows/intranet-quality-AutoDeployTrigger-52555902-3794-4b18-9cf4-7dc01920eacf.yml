name: Trigger auto deployment for intranet-quality

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/intranet-quality-AutoDeployTrigger-52555902-3794-4b18-9cf4-7dc01920eacf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.INTRANETQUALITY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.INTRANETQUALITY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.INTRANETQUALITY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: intranetquality-bzgbadb9chh3fcdf.azurecr.io
          registryUsername: ${{ secrets.INTRANETQUALITY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.INTRANETQUALITY_REGISTRY_PASSWORD }}
          containerAppName: intranet-quality
          resourceGroup: DORVE-Intranet-Quality
          imageToBuild: intranetquality-bzgbadb9chh3fcdf.azurecr.io/intranet-quality:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


