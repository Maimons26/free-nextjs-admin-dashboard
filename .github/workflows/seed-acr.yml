name: Seed Azure Container Registry

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: intranetquality-bzgbadb9chh3fcdf.azurecr.io
          username: intranetquality
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: intranetquality-bzgbadb9chh3fcdf.azurecr.io/intranet-quality:seed
